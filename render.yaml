# Render Blueprint — SWIPE X Platform
# https://render.com/docs/blueprint-spec

databases:
  - name: swipe-x-db
    plan: free
    databaseName: swipe_x
    user: swipe_x_user
    postgresMajorVersion: "16"

services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  - type: web
    name: swipe-x-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swipe-x-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a secure random string
      - key: FRONTEND_URL
        fromService:
          type: web
          name: swipe-x-frontend
          property: url
      - key: PYTHON_VERSION
        value: "3.11.12"

  # ── Frontend (React + Vite → Static Site) ──────────────────
  - type: web
    name: swipe-x-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: swipe-x-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
