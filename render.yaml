# Render Blueprint — SWIPE X Backend & Database
# https://render.com/docs/blueprint-spec

databases:
  - name: swipe-x-db
    plan: free
    databaseName: swipe_x
    user: swipe_x_user
    postgresMajorVersion: "16"

services:
  # ── Backend (FastAPI) ──────────────────────────────────────
  - type: web
    name: swipe-x-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swipe-x-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.12"
